<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffdc58" />
    <title>Offline · EchoLeaks</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #fff7e8; color: #000; font-family: system-ui, sans-serif; }
      main { max-width: 360px; border: 2px solid #000; border-radius: 20px; background: #fff; box-shadow: 6px 6px 0 #000; padding: 28px; }
      h1 { margin: 0 0 12px; font-size: 1.6rem; }
      p { line-height: 1.5; }
      a { display: inline-block; margin-top: 12px; padding: 10px 20px; border: 2px solid #000; border-radius: 999px; background: #ffdc58; color: #000; font-weight: 700; text-decoration: none; box-shadow: 3px 3px 0 #000; }
    </style>
  </head>
  <body>
    <main>
      <h1>EchoLeaks is offline</h1>
      <p>Reconnect to access your account, share files, or view protected documents.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
